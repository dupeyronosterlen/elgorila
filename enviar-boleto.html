<style>
:root {
  --bg: #0a0706;
  --fg: #f1ead9;
  --gold: #d99b3a;
  --gold-faint: rgba(217,155,58,.25);
  --gold-dim: rgba(217,155,58,.45);
  --green: #128C7E;
  --display: "Cormorant Garamond", Georgia, serif;
  --cuerpo: "EB Garamond", Georgia, serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg); }
body { font-family: var(--cuerpo); font-size: 18px; line-height: 1.6; }
.wrap { max-width: 420px; margin: 0 auto; padding: 40px 20px 56px; text-align: center; }
.kicker {
  font-family: var(--mono); font-size: 10px; letter-spacing: .28em;
  text-transform: uppercase; color: var(--gold); margin: 0 0 16px;
}
h1 {
  font-family: var(--display); font-size: clamp(2rem, 7vw, 2.5rem);
  font-weight: 500; line-height: 1.05; margin: 0 0 12px;
}
.sub { color: rgba(241,234,217,.78); margin: 0 0 24px; font-size: 1.05rem; }
.boleto-preview {
  margin: 0 auto 14px; max-width: 270px;
  border: 1px solid var(--gold-faint); background: rgba(0,0,0,.35);
}
.boleto-preview img { display: block; width: 100%; height: auto; }
.boleto-meta {
  font-family: var(--display); font-size: 20px; font-weight: 500;
  color: var(--fg); text-align: center; margin: 0 0 6px;
}
.boleto-cert {
  font-family: var(--mono); font-size: 11px; letter-spacing: .06em;
  color: rgba(241,234,217,.55); text-align: center; word-break: break-all;
  margin: 0 0 14px;
}
.btn-guardar-boleto {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; padding: 14px 18px; margin-bottom: 10px;
  background: transparent; border: 1px solid var(--gold-faint);
  color: var(--gold); font-family: var(--cuerpo); font-size: 17px;
  font-weight: 500; cursor: pointer; transition: border-color .15s, background .15s;
}
.btn-guardar-boleto:hover { border-color: var(--gold-dim); background: rgba(212,175,55,0.06); }
.btn-guardar-boleto .material-symbols-outlined { font-size: 20px; }
.boleto-hint {
  font-family: var(--cuerpo); font-size: 16px; line-height: 1.65;
  color: rgba(241,234,217,.55); text-align: center; margin: 0 0 16px;
}
.boleto-fallback-qr {
  display: flex; align-items: flex-start; gap: 14px;
  padding: 14px; border: 1px solid var(--gold-faint); background: rgba(0,0,0,.2);
  text-align: left;
}
.boleto-fallback-qr .qr-box {
  flex-shrink: 0; width: 96px; height: 96px; padding: 6px;
  background: #fff; border-radius: 4px;
}
#btn-whatsapp-container:not(.hidden) { margin-bottom: 12px; }
.btn-wa {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  width: 100%; padding: 14px 20px; border: 1px solid rgba(37,211,102,.45);
  background: rgba(18,140,126,.25); color: #6ee7b7; font-family: var(--cuerpo);
  font-size: 17px; font-weight: 600; cursor: pointer;
  transition: background .15s, border-color .15s;
}
.btn-wa:hover { background: rgba(18,140,126,.4); border-color: rgba(37,211,102,.6); }
.btn-wa:disabled { opacity: .45; cursor: not-allowed; }
.btn-wa svg { width: 22px; height: 22px; flex-shrink: 0; }
.wa-hint { font-size: 14px; color: rgba(241,234,217,.5); margin: 8px 0 0; line-height: 1.55; }
.hint { font-size: 14px; color: rgba(241,234,217,.55); margin: 16px 0 0; line-height: 1.55; }
.error { color: #f87171; padding: 20px; border: 1px solid rgba(248,113,113,.3); margin-top: 20px; }
.hidden { display: none !important; }
#estado-carga { padding: 48px 0; color: rgba(241,234,217,.6); }
