<script>
(function () {
  var DESTINO = '/sobre-la-obra.html';

    var host = '';
    try { host = new URL(document.referrer).hostname.replace(/^www\./, ''); } catch (e) {}
    if (host && host !== location.hostname.replace(/^www\./, '')) {
      var fuentes = [
        [/(^|\.)google\./, 'google', 'organic'],

        [/(^|\.)duckduckgo\.com$/, 'duckduckgo', 'organic'],

        [/instagram\.com$/, 'instagram', 'social'],
        [/(facebook\.com|fb\.me)$/, 'facebook', 'social'],
        [/(t\.co|twitter\.com|x\.com)$/, 'x', 'social'],
        [/tiktok\.com$/, 'tiktok', 'social'],
        [/(whatsapp\.com|wa\.me)$/, 'whatsapp', 'social']
      ];
      var fuente = [host, 'referral'];
      for (var i = 0; i < fuentes.length; i++) {
        if (fuentes[i][0].test(host)) { fuente = [fuentes[i][1], fuentes[i][2]]; break; }
      }
      q.set('utm_source', fuente[0]);
      q.set('utm_medium', fuente[1]);
    }
  }
  var s = q.toString();
  location.replace(DESTINO + (s ? '?' + s : '') + location.hash);
})();
