    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary:            "#d99b3a",
                        "background-dark":  "#0a0706",
                        "surface-dark":     "#120d0b",
                        "text-dark":        "#f1ead9",
                        "accent-gold":      "#d99b3a",
                        "accent-red":       "#D43A1A",
                    },
                    fontFamily: {
                        display: ['"Cormorant Garamond"', "Georgia", "serif"],
                        body:    ['"EB Garamond"', "Georgia", "serif"],
                        mono:    ['"JetBrains Mono"', "ui-monospace", "monospace"],
                    },
                },
            },
        };
    </script>
    <style>
        :root {
            --d-bg:    #0a0706;
            --d-bg2:   #120d0b;
            --d-fg:    #f1ead9;
            --d-soft:  rgba(241,234,217,.72);
            --d-faint: rgba(241,234,217,.1);
            --gold:    #d99b3a;
            --gold-dim:rgba(217,155,58,.6);
            --red:     #D43A1A;
            --display: "Cormorant Garamond", Georgia, serif;
            --cuerpo:  "EB Garamond", Georgia, serif;
            --mono:    "JetBrains Mono", ui-monospace, monospace;
        }
        body {
            background: var(--d-bg) !important;
            font-family: var(--cuerpo);
            font-size: 17px;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }
        /* Eliminar bordes redondeados → estilo v3 (esquinas vivas) */
        .rounded-lg, .rounded-xl, .rounded-md { border-radius: 0 !important; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        /* Login v3 — línea roja + título Cormorant */
        #login-screen { background: var(--d-bg) !important; }
        .login-card-inner {
            border-color: rgba(217,155,58,.25) !important;
        }
        .login-card-inner::before {
            content: '';
            display: block; width: 44px; height: 2px;
            background: var(--red); margin: 0 auto 18px;
        }
        #login-screen h2 {
            font-family: var(--display) !important;
            font-weight: 500 !important;
            font-size: clamp(2rem, 5vw, 2.5rem) !important;
            letter-spacing: -.02em !important;
            line-height: .95 !important;
        }
        #login-screen .font-mono,
        #login-screen label {
            font-family: var(--mono) !important;
            font-size: 10px !important;
            letter-spacing: .22em !important;
            text-transform: uppercase;
        }
        /* Admin header v3 */
        #admin-panel > header h1 {
            font-family: var(--display) !important;
            font-weight: 500 !important;
            font-size: clamp(2rem, 5vw, 2.75rem) !important;
            letter-spacing: -.02em !important;
            line-height: .95 !important;
        }
        #admin-panel > header p {
            font-family: var(--cuerpo) !important;
        }
        /* Nav links */
        #admin-nav {
            background: rgba(10,7,6,.95) !important;
            border-color: rgba(217,155,58,.2) !important;
        }
        /* Section headings */
        .font-display {
            font-family: var(--display) !important;
            font-weight: 500 !important;
            letter-spacing: -.01em;
        }
        .font-mono {
            font-family: var(--mono) !important;
            letter-spacing: .18em;
        }
        /* Table rows */
        #tabla-ventas td, #tabla-usuarios td,
        #tabla-funciones-especiales td, #tabla-auditoria td,
        #tabla-efectivo td {
            font-family: var(--cuerpo);
            font-size: 17px;
        }
        #tabla-ventas th, #tabla-usuarios th,
        #tabla-funciones-especiales th, #tabla-auditoria th,
        #tabla-efectivo th {
            font-family: var(--mono) !important;
            font-size: 10px !important;
            letter-spacing: .18em !important;
            text-transform: uppercase;
        }
        /* Inputs v3 */
        input, select, textarea {
            font-family: var(--cuerpo) !important;
            font-size: 17px !important;
            border-radius: 0 !important;
        }
        /* Botones v3 */
        button, [type="button"], [type="submit"] {
            font-family: var(--cuerpo);
            border-radius: 0 !important;
        }
        /* Modals v3 */
        #modal-funcion > div,
        #modal-usuario > div,
        #modal-scanner-admin > div { border-radius: 0 !important; }
        /* Logo flotante */
        html { scroll-behavior: smooth; }
        #admin-nav {
            overflow-x: auto;
            overflow-y: hidden;
            flex-wrap: nowrap;
            -webkit-overflow-scrolling: touch;
        }
        #admin-nav .admin-nav-link { white-space: nowrap; }
        .admin-section { display: block; }
        .logo-home-flotante {
            position: fixed;
            top: 0.75rem;
            left: 0.75rem;
            z-index: 50;
            display: flex;
            align-items: center;
            padding: 0.25rem;
            background: rgba(10, 7, 6, 0.9);
            border: 1px solid rgba(217, 155, 58, 0.25);
            border-radius: 0;
            transition: opacity 0.2s, border-color 0.2s;
        }
        .logo-home-flotante:hover { opacity: 0.95; border-color: rgba(217, 155, 58, 0.5); }
        .logo-home-flotante img { height: 2rem; width: auto; max-width: 100px; object-fit: contain; }
        #detalles-enlaces-contacto summary::-webkit-details-marker { display: none; }
        #detalles-enlaces-contacto summary::marker { display: none; }
    </style>
</head>
<body class="font-body bg-background-dark text-text-dark min-h-screen">
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-P4BDXRN9"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->
    <a href="index.html" class="logo-home-flotante" aria-label="Ir a la página principal">
        <img src="img/ELGORILA/LETRAS EL GORILA DE FRANZ KAFKA 2025.png" alt="EL GORILA" loading="lazy" decoding="async"/>
    </a>
    <!-- Pantalla de Login -->
    <div id="login-screen" class="min-h-screen flex items-center justify-center">
        <div class="login-card-inner bg-surface-dark/90 backdrop-blur-sm p-8 rounded-lg border border-primary/30 max-w-md w-full mx-4 text-center">
            <h2 class="text-3xl font-display font-bold text-primary mb-2 text-center">El Gorila</h2>
            <p class="text-sm font-mono text-text-dark/50 mb-6 tracking-widest uppercase text-center">Acceso al sistema</p>
            <div class="space-y-4 mt-6">
                <div>
                    <label class="block text-text-dark/70 mb-2">Usuario ID</label>
                    <input type="text" id="usuario-input" class="w-full px-4 py-2 bg-background-dark border border-primary/30 rounded text-text-dark focus:outline-none focus:border-primary" placeholder="gorila" autocomplete="username">
                </div>
                <div>
                    <label class="block text-text-dark/70 mb-2">Contraseña</label>
                    <input type="password" id="password-input" class="w-full px-4 py-2 bg-background-dark border border-primary/30 rounded text-text-dark focus:outline-none focus:border-primary" placeholder="Ingresa la contraseña" autocomplete="current-password">
                </div>
                <button type="button" onclick="verificarAcceso()" class="w-full bg-primary hover:bg-primary/90 text-background-dark font-bold py-2 px-4 rounded transition-colors" aria-label="Iniciar sesión en el panel">
                    Acceder
                </button>
                <div id="error-login" class="hidden bg-red-900/30 border border-red-800/50 text-red-300 p-3 rounded text-sm"></div>
            </div>
        </div>
    </div>

    <!-- Panel Principal (oculto inicialmente) -->
    <div id="admin-panel" class="container mx-auto px-4 sm:px-6 lg:px-8 py-8 hidden">
        <header class="mb-8">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-4xl font-display font-bold text-primary mb-2">Panel de Administración</h1>
                    <p class="text-text-dark/70">El Gorila de Franz Kafka</p>
                    <p class="text-sm text-text-dark/60 mt-1">
                        Usuario: <span id="usuario-actual" class="text-accent-gold font-semibold">-</span> | 
                        Rol: <span id="rol-actual" class="text-accent-gold font-semibold">-</span>
                    </p>
                </div>
                <div class="flex gap-3 flex-wrap">
                    <a href="boletera.html" id="link-boletera" class="px-4 py-2 bg-primary/20 hover:bg-primary/30 text-primary rounded-sm transition-colors border border-primary/30 text-sm hidden">
                        <span class="material-symbols-outlined align-middle text-sm">confirmation_number</span>
                        Boletera
                    </a>
                    <a href="verificar.html" id="link-verificar" class="px-4 py-2 bg-primary/20 hover:bg-primary/30 text-primary rounded-sm transition-colors border border-primary/30 text-sm hidden">
                        <span class="material-symbols-outlined align-middle text-sm">qr_code_scanner</span>
                        Verificar
                    </a>
                    <button type="button" onclick="cerrarSesion()" class="px-4 py-2 bg-red-900/30 hover:bg-red-900/40 text-red-300 rounded-sm transition-colors border border-red-800/30 text-sm" aria-label="Cerrar sesión">
                        Cerrar Sesión
                    </button>
                    <button type="button" id="btn-mi-cuenta" class="hidden px-4 py-2 bg-primary/20 hover:bg-primary/30 text-primary rounded-sm transition-colors border border-primary/30 text-sm" onclick="mostrarFormularioUsuario(AuthManager.obtenerUsuarioActual().usuarioId)">
                        Cambiar mi contraseña
                    </button>
                    <button type="button" onclick="window.open('index.html', '_blank')" class="px-4 py-2 bg-primary/20 hover:bg-primary/30 text-primary rounded-sm transition-colors border border-primary/30 text-sm" aria-label="Abrir página principal en nueva pestaña">
                        Ver sitio
                    </button>
                    <a href="index.html" class="px-4 py-2 bg-primary/20 hover:bg-primary/30 text-primary rounded-sm transition-colors border border-primary/30" aria-label="Volver a la página principal del sitio">
                        Volver al sitio
                    </a>
                </div>
            </div>
        </header>

        <div id="admin-app"></div>
    </div>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/admin-panel.js"></script>
</body>
</html>
