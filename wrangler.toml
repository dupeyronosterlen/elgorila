name = "elgorila-api"
main = "worker/index.js"
compatibility_date = "2025-06-01"
account_id = "010612a0651e3670d9c7cf09b3934961"
# Sin esto, añadir [[routes]] infiere workers_dev=false y Stripe deja de
# alcanzar el webhook en *.workers.dev (error 1042).
workers_dev = true
preview_urls = true

# Misma zona que el sitio. Así el navegador llama a /api en elgorilateatro.com.mx
# y no a *.workers.dev (algunos ISPs interceptan o cuelgan ese host).
[[routes]]
pattern = "elgorilateatro.com.mx/api/*"
zone_id = "c810a86aac2ff1050510debbc192f7fd"

[[routes]]
pattern = "www.elgorilateatro.com.mx/api/*"
zone_id = "c810a86aac2ff1050510debbc192f7fd"

# ─── KV Namespaces ────────────────────────────────────────────────────────────
# Después de ejecutar los comandos de creación (ver README de Phase 2A),
# reemplaza los IDs de placeholder con los IDs reales que devuelve wrangler.
# preview_id se usa con `wrangler dev`; id se usa en producción.

[[kv_namespaces]]
binding = "INVENTARIO"
id = "5c1712aba9eb40108d75b9ba12cbd3dd"
preview_id = "a950cf9717a644b48d7912d1334abd8a"

[[kv_namespaces]]
binding = "VENTAS"
id = "1a9c033a4cca4347b05ab8fc5b2f8ba2"
preview_id = "8342e8b9abe14759ae1e6ea07d8bbd8c"

# ─── Durable Object: inventario por función ──────────────────────────────────
# El inventario NO puede vivir en KV: KV no es linealizable y limita ~1 escritura
# por segundo por llave. Dos compras simultáneas se pisaban entre sí (ver el
# comentario largo en worker/index.js, clase InventarioFuncion).
# Una instancia por "{teatro}:funcion:{fecha}" → escrituras serializadas.
# KV queda como réplica de solo lectura para admin/reportes/endpoint público.
[[durable_objects.bindings]]
name = "INVENTARIO_DO"
class_name = "InventarioFuncion"

# SQLite-backed: disponible en el plan gratuito de Workers.
[[migrations]]
tag = "v1-inventario-do"
new_sqlite_classes = ["InventarioFuncion"]

# ─── Secrets ──────────────────────────────────────────────────────────────────
# JWT_SECRET, STRIPE_SECRET_KEY y STRIPE_WEBHOOK_SECRET NO van aquí.
# Definirlos en [vars] — aunque sea con valor vacío — hace que wrangler los
# trate como variables de entorno y sobreescriba los Secrets del Dashboard en
# cada deploy.
#
# Configurar ÚNICAMENTE en:
#   Cloudflare Dashboard → Workers & Pages → elgorila-api
#   → Settings → Variables and Secrets → Add secret
#
# ADMIN_USER_UNIVERSAL / ADMIN_PASS_UNIVERSAL → cuenta compartida admin y boletera (solo en Cloudflare Secrets)
# TURNSTILE_SECRET_KEY → verificación anti-bot del login admin (no en boletos.html). Sin este secret el login sigue igual.

# Rate-limit login: 10 intentos / 15 min. Mantener "false" en temporada en vivo.
[vars]
DISABLE_LOGIN_RATE_LIMIT = "false"

# 13:00 UTC = 7:00 CDMX (México ya no tiene horario de verano desde 2022) —
# correo matutino día de función, todos los días.
# 14:00 UTC domingos = 8:00 CDMX — correo "sorpresa" post-función (certificado
# + cupón BUTACA37 + reseña Google) a los asistentes de la función del sábado
# anterior. Decisión de Os, 4 sep 2026.
[triggers]
crons = ["0 13 * * *", "0 14 * * 7"]

# Workers Logs — JSON estructurado sin PII (ver worker/logs.js)
[observability]
enabled = true
head_sampling_rate = 1
